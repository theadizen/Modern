<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMJH | Luxury Gold Exchange Calculator</title>
    <link rel="icon" href="logo.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-cream: #FFF9F2;
            --card-white: #FFFFFF;
            --text-dark: #111111;
            --gold-accent: #C9A86A;
            --border-gold: #E5D3A1;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-cream); 
            color: var(--text-dark); 
            -webkit-font-smoothing: antialiased;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        .receipt-card {
            background-color: var(--card-white);
            border: 1px solid var(--border-gold);
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
        }
        
        .gold-highlight {
            background-color: var(--bg-cream);
            border: 1px solid var(--gold-accent);
        }

        /* Custom Scrollbar for Admin Panel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-gold); border-radius: 10px; }

        @media print {
            body { background-color: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            main.grid { display: block !important; }
            #receipt { 
                box-shadow: none !important; 
                border: none !important; 
                width: 100% !important; 
                max-width: 100% !important; 
                margin: 0 auto !important; 
                padding: 20px !important;
                page-break-inside: avoid;
            }
            .print-area { padding: 0px; }
            @page { margin: 1cm; size: A4 portrait; }
        }

        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body class="pb-24 md:pb-10 p-4 md:p-10 min-h-screen">

    <header class="max-w-6xl mx-auto mb-10 flex justify-between items-end no-print border-b border-[#E5D3A1] pb-4">
        <div class="flex items-center gap-5">
            <img src="logo.png" alt="TMJH Logo" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100%25\' height=\'100%25\' fill=\'%23FFF9F2\' rx=\'12\' stroke=\'%23E5D3A1\' stroke-width=\'4\' /%3E%3Ctext x=\'50%25\' y=\'52%25\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-family=\'serif\' font-size=\'26\' font-weight=\'bold\' fill=\'%23C9A86A\'%3ETMJH%3C/text%3E%3C/svg%3E';" class="w-16 h-16 object-contain rounded">
            <div>
                <h1 class="text-3xl font-serif font-bold text-[#111111] leading-tight">TMJH</h1>
                <p class="text-xs tracking-[0.2em] uppercase text-[#C9A86A] font-medium">The Modern Jewellery House</p>
            </div>
        </div>
        <button onclick="toggleAdmin()" class="text-sm font-medium tracking-wide uppercase text-[#111111] hover:text-[#C9A86A] transition-colors border-b border-transparent hover:border-[#C9A86A] pb-1">
            Admin Panel
        </button>
    </header>

    <main class="max-w-6xl mx-auto grid lg:grid-cols-12 gap-10">
        
        <section class="lg:col-span-5 space-y-6 no-print">
            <div class="bg-white p-8 rounded-xl border border-[#E5D3A1] shadow-sm">
                <h3 class="font-serif font-semibold text-xl mb-6 text-[#111111] flex items-center gap-2">
                    <svg class="w-5 h-5 text-[#C9A86A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    Calculator
                </h3>
                
                <div class="space-y-6">
                    <div class="group">
                        <label class="block text-xs font-semibold tracking-wider uppercase mb-2 text-[#111111] opacity-70 group-focus-within:opacity-100 group-focus-within:text-[#C9A86A] transition-colors">Gold Rate / gm (₹)</label>
                        <input type="number" id="rate1g" min="0" step="any" oninput="saveAndCalculate()" class="w-full border-b-2 border-[#E5D3A1] bg-transparent pb-2 text-lg focus:outline-none focus:border-[#C9A86A] transition-colors" placeholder="0">
                    </div>
                    <div class="group">
                        <label class="block text-xs font-semibold tracking-wider uppercase mb-2 text-[#111111] opacity-70 group-focus-within:opacity-100 group-focus-within:text-[#C9A86A] transition-colors">Gold Weight (gm)</label>
                        <input type="number" id="grossWt" min="0" step="any" oninput="saveAndCalculate()" class="w-full border-b-2 border-[#E5D3A1] bg-transparent pb-2 text-lg focus:outline-none focus:border-[#C9A86A] transition-colors" placeholder="0.000">
                    </div>
                    <div class="group">
                        <label id="makingLabel" for="making" class="block text-xs font-semibold tracking-wider uppercase mb-2 text-[#111111] opacity-70 group-focus-within:opacity-100 group-focus-within:text-[#C9A86A] transition-colors">Making Charge (₹)</label>
                        <input type="number" id="making" min="0" step="any" oninput="saveAndCalculate()" class="w-full border-b-2 border-[#E5D3A1] bg-transparent pb-2 text-lg focus:outline-none focus:border-[#C9A86A] transition-colors" placeholder="0">
                    </div>
                    <div class="group">
                        <label class="block text-xs font-semibold tracking-wider uppercase mb-2 text-[#111111] opacity-70 group-focus-within:opacity-100 group-focus-within:text-[#C9A86A] transition-colors">HM Pieces</label>
                        <input type="number" id="hmQty" min="0" step="1" inputmode="numeric" oninput="saveAndCalculate()" class="w-full border-b-2 border-[#E5D3A1] bg-transparent pb-2 text-lg focus:outline-none focus:border-[#C9A86A] transition-colors" placeholder="0">
                    </div>
                    
                    <!-- Extra Charges Section -->
                    <div class="group pt-4 border-t border-[#E5D3A1]/50">
                        <div class="flex justify-between items-center mb-3">
                            <label class="block text-xs font-semibold tracking-wider uppercase text-[#111111] opacity-70 transition-colors">Extra Charges</label>
                            <button type="button" onclick="addAddon()" class="text-[10px] uppercase font-bold tracking-widest text-[#C9A86A] hover:text-[#111111] bg-[#FFF9F2] px-2 py-1 rounded border border-[#E5D3A1] transition-colors shadow-sm">+ Add Charge</button>
                        </div>
                        <div id="additionalChargesContainer" class="space-y-3"></div>
                    </div>

                    <div class="group pt-4 border-t border-[#E5D3A1]/50">
                        <label class="block text-xs font-semibold tracking-wider uppercase mb-2 text-[#111111] opacity-70 group-focus-within:opacity-100 group-focus-within:text-[#C9A86A] transition-colors">Old Gold Weight (gm)</label>
                        <input type="number" id="oldGold" min="0" step="any" oninput="saveAndCalculate()" class="w-full border-b-2 border-[#E5D3A1] bg-transparent pb-2 text-lg focus:outline-none focus:border-[#C9A86A] transition-colors" placeholder="0.000">
                    </div>
                    
                    <div class="group">
                        <label class="flex items-center gap-2 cursor-pointer mb-2">
                            <input type="checkbox" id="applyOldGoldDed" onchange="toggleOldGoldDedInput(); saveAndCalculate()" class="w-4 h-4 accent-[#C9A86A] cursor-pointer">
                            <span class="text-xs font-semibold tracking-wider uppercase text-[#111111] opacity-90">Old Gold Deduction</span>
                        </label>
                        <div id="oldGoldDedContainer" class="hidden transition-all mt-3">
                            <label class="block text-[10px] font-semibold tracking-wider uppercase mb-1 text-[#111111] opacity-70">Deduction (%)</label>
                            <input type="number" id="oldGoldDed" min="0" max="100" step="any" oninput="saveAndCalculate()" class="w-full border-b-2 border-[#E5D3A1] bg-transparent pb-2 text-lg focus:outline-none focus:border-[#C9A86A] transition-colors" placeholder="0">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="hidden md:grid grid-cols-3 gap-4 no-print">
                <button onclick="window.print()" class="flex flex-col items-center justify-center gap-2 py-4 bg-white border border-[#E5D3A1] rounded-xl hover:border-[#C9A86A] hover:bg-[#FFF9F2] hover:shadow-md transition-all text-[#111111]">
                    <svg class="w-6 h-6 text-[#C9A86A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    <span class="text-xs font-medium uppercase tracking-wide">Print</span>
                </button>
                <button onclick="downloadPDF()" class="flex flex-col items-center justify-center gap-2 py-4 bg-white border border-[#E5D3A1] rounded-xl hover:border-[#C9A86A] hover:bg-[#FFF9F2] hover:shadow-md transition-all text-[#111111]">
                    <svg class="w-6 h-6 text-[#C9A86A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    <span class="text-xs font-medium uppercase tracking-wide">PDF</span>
                </button>
                <button onclick="downloadPNG()" class="flex flex-col items-center justify-center gap-2 py-4 bg-white border border-[#E5D3A1] rounded-xl hover:border-[#C9A86A] hover:bg-[#FFF9F2] hover:shadow-md transition-all text-[#111111]">
                    <svg class="w-6 h-6 text-[#C9A86A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-xs font-medium uppercase tracking-wide">Image</span>
                </button>
            </div>
        </section>

        <section class="lg:col-span-7">
            <!-- This div is what gets exported/printed -->
            <div id="receipt" class="receipt-card p-8 md:p-12 rounded-xl print-area text-[#111111]">
                
                <!-- Receipt Header -->
                <div class="text-center mb-8 pb-8 border-b border-[#E5D3A1]">
                    <img src="logo.png" alt="TMJH Logo" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100%25\' height=\'100%25\' fill=\'%23FFF9F2\' rx=\'12\' stroke=\'%23E5D3A1\' stroke-width=\'4\' /%3E%3Ctext x=\'50%25\' y=\'52%25\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-family=\'serif\' font-size=\'26\' font-weight=\'bold\' fill=\'%23C9A86A\'%3ETMJH%3C/text%3E%3C/svg%3E';" class="w-20 h-20 mx-auto mb-4 object-contain">
                    <h2 class="text-3xl font-serif font-bold text-[#111111]">TMJH</h2>
                    <p class="text-sm tracking-[0.2em] uppercase text-[#C9A86A] mt-1">The Modern Jewellery House</p>
                    
                    <div class="flex justify-between items-center mt-8 text-xs font-medium opacity-80">
                        <span id="receiptDate"></span>
                        <span id="receiptId" class="font-mono"></span>
                    </div>
                </div>

                <!-- Calculation Inject Container -->
                <div id="results" class="space-y-6">
                    <!-- Javascript will inject sections here -->
                </div>
                
                <!-- Receipt Footer -->
                <div class="mt-12 text-center text-[10px] text-gray-400 uppercase tracking-widest">
                    <p>Thank you for choosing TMJH</p>
                    <p class="mt-1">This is a computer generated estimate</p>
                </div>
            </div>
        </section>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t border-[#E5D3A1] md:hidden z-40 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] no-print">
        <div class="flex gap-3 max-w-md mx-auto">
            <button onclick="window.print()" class="flex-1 flex flex-col items-center justify-center py-2 px-1 bg-white border border-[#E5D3A1] rounded-lg shadow-sm text-[#111111] active:bg-[#FFF9F2]">
                <svg class="w-5 h-5 mb-1 text-[#C9A86A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                <span class="text-[10px] uppercase font-semibold">Print</span>
            </button>
            <button onclick="downloadPDF()" class="flex-1 flex flex-col items-center justify-center py-2 px-1 bg-white border border-[#E5D3A1] rounded-lg shadow-sm text-[#111111] active:bg-[#FFF9F2]">
                <svg class="w-5 h-5 mb-1 text-[#C9A86A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                <span class="text-[10px] uppercase font-semibold">PDF</span>
            </button>
            <button onclick="downloadPNG()" class="flex-1 flex flex-col items-center justify-center py-2 px-1 bg-white border border-[#E5D3A1] rounded-lg shadow-sm text-[#111111] active:bg-[#FFF9F2]">
                <svg class="w-5 h-5 mb-1 text-[#C9A86A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="text-[10px] uppercase font-semibold">Image</span>
            </button>
            <button onclick="shareReceipt()" class="flex-1 flex flex-col items-center justify-center py-2 px-1 bg-white border border-[#E5D3A1] rounded-lg shadow-sm text-[#111111] active:bg-[#FFF9F2]">
                <svg class="w-5 h-5 mb-1 text-[#C9A86A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                <span class="text-[10px] uppercase font-semibold">Share</span>
            </button>
        </div>
    </div>

    <div id="adminPanel" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex justify-end no-print transition-opacity">
        <div class="w-full max-w-sm bg-white h-full p-8 overflow-y-auto shadow-2xl animate-[slideIn_0.3s_ease-out]">
            <div class="flex justify-between items-center mb-8 border-b border-[#E5D3A1] pb-4">
                <h3 class="font-serif text-2xl font-bold text-[#111111]">Store Settings</h3>
                <button onclick="toggleAdmin()" class="text-gray-400 hover:text-[#111111] transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Password Protection Area -->
            <div id="authArea" class="space-y-4">
                <label class="block text-xs uppercase tracking-wide font-semibold">Enter Admin Password</label>
                <div class="relative">
                    <input type="password" id="adminPass" class="w-full p-3 border-2 border-[#E5D3A1] rounded-lg focus:outline-none focus:border-[#C9A86A] transition-colors pr-10" placeholder="Password">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3.5 text-gray-400 hover:text-[#111111]">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Secured Controls Area -->
            <div id="adminControls" class="hidden space-y-6 mt-6">
                <div>
                    <label class="block text-xs uppercase tracking-wide font-semibold mb-2">Old Gold Deduction %</label>
                    <input type="number" id="setOldGoldDed" min="0" step="any" class="w-full p-3 border-2 border-[#E5D3A1] rounded-lg focus:outline-none focus:border-[#C9A86A]">
                </div>
                <button onclick="saveAdmin()" class="w-full bg-[#111111] hover:bg-[#C9A86A] text-white font-medium py-4 rounded-lg uppercase tracking-widest transition-colors mt-8">
                    Update System Settings
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification System -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-[#111111] text-white px-6 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-[60] flex items-center gap-2">
        <svg class="w-5 h-5 text-[#C9A86A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMsg" class="text-sm font-medium tracking-wide"></span>
    </div>

    <script>
        const ADMIN_SECRET = "1234";
        const GST_PERCENT = 3;
        const HM_CHARGE_PER_PIECE = 92;
        const MAKING_DISCOUNT_PERCENT = 30;
        const configDefaults = { oldGoldDeduction: 0 };

        function safeNumber(value, fallback = 0) {
            const number = Number.parseFloat(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function clamp(value, min, max = Number.MAX_SAFE_INTEGER) {
            return Math.min(max, Math.max(min, value));
        }

        function roundMoney(value) {
            return Math.round((safeNumber(value) + Number.EPSILON) * 100) / 100;
        }

        function fmt(value) {
            return '₹' + roundMoney(value).toLocaleString('en-IN', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
        }

        function fmtWt(value) {
            return clamp(safeNumber(value), 0).toLocaleString('en-IN', {
                minimumFractionDigits: 3,
                maximumFractionDigits: 3
            }) + ' gm';
        }

        function readStoredConfig() {
            try {
                const raw = localStorage.getItem('tjmhConfig');
                if (!raw) return { ...configDefaults };
                const parsed = JSON.parse(raw);
                return {
                    oldGoldDeduction: clamp(safeNumber(parsed?.oldGoldDeduction, configDefaults.oldGoldDeduction), 0, 100)
                };
            } catch (error) {
                console.warn('Could not load calculator settings:', error);
                return { ...configDefaults };
            }
        }

        function readStoredForm(config) {
            const defaults = {
                rate1g: '', grossWt: '', making: '', hmQty: '', oldGold: '',
                applyOldGoldDed: false, oldGoldDed: String(config.oldGoldDeduction), addons: []
            };
            try {
                const raw = localStorage.getItem('tjmhFormState');
                if (!raw) return defaults;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return defaults;

                // Migrate older versions that stored the gold weight as "qty".
                const grossWt = parsed.grossWt ?? parsed.qty ?? defaults.grossWt;
                const rawAddons = Array.isArray(parsed.addons) ? parsed.addons : [];
                const addons = rawAddons.map(item => {
                    const amount = (item && typeof item === 'object') ? item.amount : item;
                    return amount == null ? '' : String(amount);
                });

                return {
                    rate1g: parsed.rate1g == null ? '' : String(parsed.rate1g),
                    grossWt: grossWt == null ? '' : String(grossWt),
                    making: parsed.making == null ? '' : String(parsed.making),
                    hmQty: parsed.hmQty == null ? '' : String(parsed.hmQty),
                    oldGold: parsed.oldGold == null ? '' : String(parsed.oldGold),
                    applyOldGoldDed: parsed.applyOldGoldDed === true,
                    oldGoldDed: parsed.oldGoldDed == null ? String(config.oldGoldDeduction) : String(parsed.oldGoldDed),
                    addons
                };
            } catch (error) {
                console.warn('Could not load saved calculator values:', error);
                return defaults;
            }
        }

        let config = readStoredConfig();
        let formState = readStoredForm(config);

        function showToast(message) {
            const toast = document.getElementById('toast');
            const messageNode = document.getElementById('toastMsg');
            if (!toast || !messageNode) return;
            messageNode.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            window.clearTimeout(showToast.timer);
            showToast.timer = window.setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function persistFormState() {
            try {
                localStorage.setItem('tjmhFormState', JSON.stringify(formState));
            } catch (error) {
                console.warn('Could not save calculator values:', error);
            }
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            const opening = panel.classList.contains('hidden');
            panel.classList.toggle('hidden');
            if (opening) {
                document.getElementById('adminPass').value = '';
                document.getElementById('adminPass').type = 'password';
                document.getElementById('adminControls').classList.add('hidden');
                document.getElementById('authArea').classList.remove('hidden');
                resetPasswordIcon();
            }
        }

        function resetPasswordIcon() {
            const icon = document.getElementById('eyeIcon');
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('adminPass');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
            } else {
                input.type = 'password';
                resetPasswordIcon();
            }
        }

        function saveAdmin() {
            const previousDefault = config.oldGoldDeduction;
            const rawValue = document.getElementById('setOldGoldDed').value;
            config.oldGoldDeduction = rawValue === '' ? configDefaults.oldGoldDeduction : clamp(safeNumber(rawValue), 0, 100);

            // Update the current form when it was still using the previous default.
            const currentDeduction = safeNumber(document.getElementById('oldGoldDed').value, previousDefault);
            if (document.getElementById('oldGoldDed').value === '' || currentDeduction === previousDefault) {
                document.getElementById('oldGoldDed').value = String(config.oldGoldDeduction);
            }
            formState.oldGoldDed = document.getElementById('oldGoldDed').value;

            try {
                localStorage.setItem('tjmhConfig', JSON.stringify(config));
                showToast('Settings saved');
            } catch (error) {
                showToast('Settings applied but could not be saved');
            }
            saveAndCalculate();
            document.getElementById('adminPanel').classList.add('hidden');
        }

        function toggleOldGoldDedInput() {
            const checked = document.getElementById('applyOldGoldDed').checked;
            document.getElementById('oldGoldDedContainer').classList.toggle('hidden', !checked);
            formState.applyOldGoldDed = checked;
        }

        function renderAddons() {
            const container = document.getElementById('additionalChargesContainer');
            container.replaceChildren();

            formState.addons.forEach((amount, index) => {
                const row = document.createElement('div');
                row.className = 'flex gap-2 items-center bg-white border border-[#E5D3A1]/50 p-2 rounded';

                const input = document.createElement('input');
                input.type = 'number';
                input.min = '0';
                input.step = '0.01';
                input.placeholder = '₹ Amount';
                input.value = amount;
                input.className = 'flex-1 bg-transparent text-sm focus:outline-none';
                input.addEventListener('input', () => {
                    formState.addons[index] = input.value;
                    saveAndCalculate();
                });

                const removeButton = document.createElement('button');
                removeButton.type = 'button';
                removeButton.className = 'text-red-400 hover:text-red-600 transition-colors p-1';
                removeButton.title = 'Remove';
                removeButton.setAttribute('aria-label', 'Remove extra charge');
                removeButton.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                removeButton.addEventListener('click', () => removeAddon(index));

                row.append(input, removeButton);
                container.appendChild(row);
            });
        }

        function addAddon() {
            formState.addons.push('');
            renderAddons();
            saveAndCalculate();
        }

        function removeAddon(index) {
            formState.addons.splice(index, 1);
            renderAddons();
            saveAndCalculate();
        }

        function normalizePieceCount(input) {
            const value = safeNumber(input.value, 0);
            input.value = String(clamp(Math.floor(value), 0));
            saveAndCalculate();
        }

        function normalizePercent(input) {
            const value = safeNumber(input.value, 0);
            input.value = String(clamp(value, 0, 100));
            saveAndCalculate();
        }

        function generateReceiptId() {
            const date = new Date();
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const random = Math.floor(1000 + Math.random() * 9000);
            return `ID: TMJH-${yyyy}${mm}${dd}-${random}`;
        }

        function saveAndCalculate() {
            formState = {
                rate1g: document.getElementById('rate1g').value,
                grossWt: document.getElementById('grossWt').value,
                making: document.getElementById('making').value,
                hmQty: document.getElementById('hmQty').value,
                oldGold: document.getElementById('oldGold').value,
                applyOldGoldDed: document.getElementById('applyOldGoldDed').checked,
                oldGoldDed: document.getElementById('oldGoldDed').value,
                addons: Array.isArray(formState.addons) ? formState.addons : []
            };
            persistFormState();
            calculate();
        }

        function calculate() {
            const rate1g = clamp(safeNumber(formState.rate1g), 0);
            const goldQty = clamp(safeNumber(formState.grossWt), 0);
            const makingInputValue = clamp(safeNumber(formState.making), 0);
            const hq = clamp(Math.floor(safeNumber(formState.hmQty)), 0);
            const oldGoldQty = clamp(safeNumber(formState.oldGold), 0);
            const isDedApplied = formState.applyOldGoldDed === true;
            const oldGoldDeductionPercent = isDedApplied
                ? clamp(safeNumber(formState.oldGoldDed), 0, 100)
                : 0;

            // <= 1.000 gm uses a fixed making amount; above 1.000 gm uses a percentage.
            const isFlatRate = goldQty <= 1;
            document.getElementById('makingLabel').textContent = isFlatRate ? 'Making Charge (₹)' : 'Making Charge (%)';
            document.getElementById('making').placeholder = isFlatRate ? '0' : '0.0';

            const goldValue = roundMoney(goldQty * rate1g);
            const originalMaking = roundMoney(isFlatRate ? makingInputValue : goldValue * makingInputValue / 100);
            const makingDiscount = roundMoney(originalMaking * MAKING_DISCOUNT_PERCENT / 100);
            const netMaking = roundMoney(originalMaking - makingDiscount);
            const taxableSubtotal = roundMoney(goldValue + netMaking);
            const gstAmount = roundMoney(taxableSubtotal * GST_PERCENT / 100);

            // Hallmark is ₹92 per whole piece, with no discount and no GST.
            const hallmarkAmount = roundMoney(hq * HM_CHARGE_PER_PIECE);

            const addonAmounts = (Array.isArray(formState.addons) ? formState.addons : [])
                .map(value => roundMoney(clamp(safeNumber(value), 0)));
            const addonsTotal = roundMoney(addonAmounts.reduce((sum, amount) => sum + amount, 0));
            const newJewelleryTotal = roundMoney(taxableSubtotal + gstAmount + hallmarkAmount + addonsTotal);

            const oldGoldGrossValue = roundMoney(oldGoldQty * rate1g);
            const oldGoldDeductionAmount = roundMoney(oldGoldGrossValue * oldGoldDeductionPercent / 100);
            const oldGoldCredit = roundMoney(oldGoldGrossValue - oldGoldDeductionAmount);
            const finalPayable = roundMoney(newJewelleryTotal - oldGoldCredit);

            const now = new Date();
            document.getElementById('receiptDate').textContent = now.toLocaleDateString('en-IN', {
                day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            const receiptId = document.getElementById('receiptId');
            if (!receiptId.textContent) receiptId.textContent = generateReceiptId();

            const addonRows = addonAmounts.map(amount => amount > 0
                ? `<div class="flex justify-between items-center text-gray-700 text-xs pl-2 border-l-2 border-[#E5D3A1]"><span>Amount</span><span>${fmt(amount)}</span></div>`
                : '').join('');

            document.getElementById('results').innerHTML = `
                <div class="mb-6">
                    <h4 class="text-[10px] uppercase font-bold tracking-widest text-[#C9A86A] mb-3 border-b border-[#E5D3A1] pb-1">New Gold</h4>
                    <div class="space-y-2 text-sm font-medium">
                        <div class="flex justify-between"><span>Rate / gm</span><span>${fmt(rate1g)}</span></div>
                        <div class="flex justify-between"><span>Weight</span><span>${fmtWt(goldQty)}</span></div>
                        <div class="flex justify-between"><span>Gold Value</span><span>${fmt(goldValue)}</span></div>
                        <div class="flex justify-between"><span>${isFlatRate ? 'Making (Fixed)' : `Making (${makingInputValue}%)`}</span><span>${fmt(originalMaking)}</span></div>
                        <div class="flex justify-between text-green-700"><span>30% Off Making</span><span>-${fmt(makingDiscount)}</span></div>
                        <div class="flex justify-between"><span>Net Making</span><span>${fmt(netMaking)}</span></div>
                        <div class="flex justify-between"><span>GST (${GST_PERCENT}%)</span><span>${fmt(gstAmount)}</span></div>
                    </div>
                </div>

                ${hq > 0 ? `
                <div class="mb-6">
                    <h4 class="text-[10px] uppercase font-bold tracking-widest text-[#C9A86A] mb-3 border-b border-[#E5D3A1] pb-1">Hallmark</h4>
                    <div class="space-y-2 text-sm font-medium">
                        <div class="flex justify-between font-semibold"><span>${hq} × ${fmt(HM_CHARGE_PER_PIECE)}</span><span>${fmt(hallmarkAmount)}</span></div>
                    </div>
                </div>` : ''}

                ${addonsTotal > 0 ? `
                <div class="mb-6">
                    <h4 class="text-[10px] uppercase font-bold tracking-widest text-[#C9A86A] mb-3 border-b border-[#E5D3A1] pb-1">Extra Charges</h4>
                    <div class="space-y-2 text-sm font-medium">
                        ${addonRows}
                        <div class="flex justify-between font-semibold"><span>Total</span><span>${fmt(addonsTotal)}</span></div>
                    </div>
                </div>` : ''}

                ${oldGoldQty > 0 ? `
                <div class="mb-6">
                    <h4 class="text-[10px] uppercase font-bold tracking-widest text-[#C9A86A] mb-3 border-b border-[#E5D3A1] pb-1">Old Gold</h4>
                    <div class="space-y-2 text-sm font-medium">
                        <div class="flex justify-between"><span>Weight</span><span>${fmtWt(oldGoldQty)}</span></div>
                        <div class="flex justify-between"><span>Value</span><span>${fmt(oldGoldGrossValue)}</span></div>
                        ${isDedApplied && oldGoldDeductionPercent > 0 ? `<div class="flex justify-between text-red-500"><span>Deduction (${oldGoldDeductionPercent}%)</span><span>-${fmt(oldGoldDeductionAmount)}</span></div>` : ''}
                        <div class="flex justify-between font-semibold text-green-700"><span>Credit</span><span>-${fmt(oldGoldCredit)}</span></div>
                    </div>
                </div>` : ''}

                <div class="mt-8">
                    <h4 class="text-[10px] uppercase font-bold tracking-widest text-[#C9A86A] mb-3 border-b border-[#E5D3A1] pb-1">Summary</h4>
                    <div class="space-y-2 text-sm font-medium mb-4">
                        <div class="flex justify-between"><span>Gold + Net Making + GST</span><span>${fmt(taxableSubtotal + gstAmount)}</span></div>
                        ${hq > 0 ? `<div class="flex justify-between"><span>HM</span><span>${fmt(hallmarkAmount)}</span></div>` : ''}
                        ${addonsTotal > 0 ? `<div class="flex justify-between"><span>Extra Charges</span><span>${fmt(addonsTotal)}</span></div>` : ''}
                        ${oldGoldQty > 0 ? `<div class="flex justify-between text-green-700"><span>Old Gold</span><span>-${fmt(oldGoldCredit)}</span></div>` : ''}
                    </div>
                    <div class="gold-highlight p-5 rounded-lg flex justify-between items-center mt-4 shadow-sm">
                        <span class="text-xs font-bold uppercase tracking-widest text-[#111111]">Payable</span>
                        <span class="text-2xl font-serif font-bold text-[#111111]">${fmt(finalPayable)}</span>
                    </div>
                </div>`;
        }

        function getFilenameStr() {
            const date = new Date();
            const pad = value => String(value).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}_${pad(date.getHours())}-${pad(date.getMinutes())}`;
        }

        async function waitForAssets(element) {
            if (document.fonts?.ready) await document.fonts.ready;
            const images = Array.from(element.querySelectorAll('img'));
            await Promise.all(images.map(image => {
                if (image.complete) return Promise.resolve();
                return new Promise(resolve => {
                    image.addEventListener('load', resolve, { once: true });
                    image.addEventListener('error', resolve, { once: true });
                });
            }));
        }

        async function captureCanvas(element) {
            if (typeof window.html2canvas !== 'function') throw new Error('Image export library is unavailable');
            await waitForAssets(element);
            const previousScrollY = window.scrollY;
            window.scrollTo(0, 0);
            try {
                await new Promise(resolve => window.setTimeout(resolve, 50));
                return await window.html2canvas(element, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#FFFFFF',
                    scrollX: 0,
                    scrollY: 0,
                    windowWidth: document.documentElement.scrollWidth,
                    windowHeight: document.documentElement.scrollHeight
                });
            } finally {
                window.scrollTo(0, previousScrollY);
            }
        }

        async function downloadPDF() {
            try {
                showToast('Preparing PDF…');
                const canvas = await captureCanvas(document.getElementById('receipt'));
                const JsPDF = window.jspdf?.jsPDF;
                if (!JsPDF) throw new Error('PDF export library is unavailable');

                const pdf = new JsPDF('p', 'mm', 'a4');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 10;
                const contentWidth = pageWidth - margin * 2;
                const contentHeight = pageHeight - margin * 2;
                const pixelsPerMm = canvas.width / contentWidth;
                const sliceHeight = Math.max(1, Math.floor(contentHeight * pixelsPerMm));

                let pageIndex = 0;
                for (let y = 0; y < canvas.height; y += sliceHeight) {
                    const height = Math.min(sliceHeight, canvas.height - y);
                    const pageCanvas = document.createElement('canvas');
                    pageCanvas.width = canvas.width;
                    pageCanvas.height = height;
                    const context = pageCanvas.getContext('2d');
                    if (!context) throw new Error('Could not prepare PDF page');
                    context.drawImage(canvas, 0, y, canvas.width, height, 0, 0, canvas.width, height);
                    if (pageIndex > 0) pdf.addPage();
                    pdf.addImage(pageCanvas.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, contentWidth, height / pixelsPerMm);
                    pageIndex += 1;
                }

                pdf.save(`TMJH_Receipt_${getFilenameStr()}.pdf`);
                showToast('PDF downloaded');
            } catch (error) {
                console.error('PDF export error:', error);
                showToast('PDF export failed. Please try again.');
            }
        }

        async function downloadPNG() {
            try {
                showToast('Preparing image…');
                const sourceCanvas = await captureCanvas(document.getElementById('receipt'));
                const targetRatio = 4 / 5;
                const sourceRatio = sourceCanvas.width / sourceCanvas.height;
                const outputWidth = Math.ceil(sourceRatio > targetRatio ? sourceCanvas.width : sourceCanvas.height * targetRatio);
                const outputHeight = Math.ceil(sourceRatio > targetRatio ? sourceCanvas.width / targetRatio : sourceCanvas.height);
                const canvas = document.createElement('canvas');
                canvas.width = outputWidth;
                canvas.height = outputHeight;
                const context = canvas.getContext('2d');
                if (!context) throw new Error('Could not prepare image');
                context.fillStyle = '#FFFFFF';
                context.fillRect(0, 0, outputWidth, outputHeight);
                context.drawImage(sourceCanvas, (outputWidth - sourceCanvas.width) / 2, (outputHeight - sourceCanvas.height) / 2);

                const link = document.createElement('a');
                link.download = `TMJH_Receipt_${getFilenameStr()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('Image downloaded');
            } catch (error) {
                console.error('Image export error:', error);
                showToast('Image export failed. Please try again.');
            }
        }

        async function shareReceipt() {
            if (typeof navigator.share !== 'function') {
                showToast('Sharing is not supported on this browser');
                return;
            }
            try {
                showToast('Preparing image…');
                const canvas = await captureCanvas(document.getElementById('receipt'));
                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob(result => result ? resolve(result) : reject(new Error('Could not create image')), 'image/png');
                });
                const file = new File([blob], `TMJH_Receipt_${getFilenameStr()}.png`, { type: 'image/png' });
                const shareData = {
                    title: 'TMJH Jewellery Estimate',
                    text: 'TMJH Jewellery Estimate',
                    files: [file]
                };
                if (typeof navigator.canShare === 'function' && !navigator.canShare({ files: [file] })) {
                    showToast('File sharing is not supported on this device');
                    return;
                }
                await navigator.share(shareData);
            } catch (error) {
                if (error?.name !== 'AbortError') {
                    console.error('Share error:', error);
                    showToast('Sharing failed. Please try again.');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('rate1g').value = formState.rate1g;
            document.getElementById('grossWt').value = formState.grossWt;
            document.getElementById('making').value = formState.making;
            document.getElementById('hmQty').value = formState.hmQty;
            document.getElementById('oldGold').value = formState.oldGold;
            document.getElementById('applyOldGoldDed').checked = formState.applyOldGoldDed;
            document.getElementById('oldGoldDed').value = formState.oldGoldDed;
            document.getElementById('setOldGoldDed').value = String(config.oldGoldDeduction);
            toggleOldGoldDedInput();

            document.getElementById('adminPass').addEventListener('input', event => {
                if (event.target.value === ADMIN_SECRET) {
                    document.getElementById('authArea').classList.add('hidden');
                    document.getElementById('adminControls').classList.remove('hidden');
                    document.getElementById('setOldGoldDed').value = String(config.oldGoldDeduction);
                }
            });

            document.getElementById('hmQty').addEventListener('change', event => normalizePieceCount(event.target));
            document.getElementById('oldGoldDed').addEventListener('change', event => normalizePercent(event.target));
            renderAddons();
            saveAndCalculate();
        });
    </script>
</body>
